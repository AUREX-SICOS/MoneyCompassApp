name: One-time v0.6.1 compiled transfer — 22 Oct 2026
on:
  push:
    branches:
      - release-candidate/v061-compiled-transfer-20261022
permissions:
  contents: write
  actions: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out public main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download verified v0.6.1 compiled Pages archive
        env:
          STATIC_RELEASE_ZIP: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-833c-8211-a46b-8bd2e9f651eb/raw?se=2026-10-22T01%3A45%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=924bdb33-93c8-5eb1-ac5c-d1ee34a25d17&skoid=c094fe1e-1dc0-485a-8de0-10ab942be48f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-22T01%3A16%3A09Z&ske=2026-10-23T01%3A16%3A09Z&sks=b&skv=2026-02-06&sig=KOM6j6u360FLNe6BKQKE2/qCHbQB20zNrCK0o8Ry7AQ%3D"
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 90 "$STATIC_RELEASE_ZIP" -o /tmp/morismoney-v061-release.zip
          test "$(stat -c%s /tmp/morismoney-v061-release.zip)" -gt 100000
          unzip -tqq /tmp/morismoney-v061-release.zip
          mkdir -p /tmp/morismoney-new-site
          unzip -q /tmp/morismoney-v061-release.zip -d /tmp/morismoney-new-site
          test -s /tmp/morismoney-new-site/index.html
          test -s /tmp/morismoney-new-site/protect/index.html
          test -s /tmp/morismoney-new-site/run/index.html
          test -s /tmp/morismoney-new-site/home/index.html
          test -d /tmp/morismoney-new-site/_next/static
          test ! -e /tmp/morismoney-new-site/api
          if find /tmp/morismoney-new-site -type f \( -name '*.map' -o -name '*.ts' -o -name '*.tsx' -o -name '.env*' \) | grep -q .; then
            echo "Refusing to publish a source file, source map or environment file"; exit 1
          fi
          grep -q '/MoneyCompassApp' /tmp/morismoney-new-site/index.html
          echo "Verified compiled-only static export and public basePath."
      - name: Replace only compiled public site files and preserve rollback history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a71c6dc9b1fc9def05bf46c781ca9317ac3b8432"
          mkdir -p site
          rsync -a --delete /tmp/morismoney-new-site/ site/
          touch site/.nojekyll
          test -s site/protect/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if git diff --cached --quiet; then
            echo "Compiled site unchanged."
          else
            git commit -m "release: publish compiled MorisMoney v0.6.1 finale demo (2e0831c)"
            git push origin HEAD:main
          fi
          echo "Public compiled-site main now at $(git rev-parse HEAD)"
      - name: Request existing production Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/AUREX-SICOS/MoneyCompassApp/actions/workflows/deploy-pages.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Triggered existing approved public Pages deployment workflow."
